<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkimDown</title>
    <link rel="stylesheet" href="shell.css" />
</head>
<body data-sidebar="visible" data-sidebar-position="left">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-sidebar" viewBox="0 0 16 16"><path d="M1.75 1h12.5A1.75 1.75 0 0 1 16 2.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25V2.75C0 1.784.784 1 1.75 1Zm4.5 1.5v11h8a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM1.5 2.75v10.5c0 .138.112.25.25.25h3v-11h-3a.25.25 0 0 0-.25.25Z"/></symbol>
            <symbol id="i-tree" viewBox="0 0 16 16"><path d="M1.75 1h5.5c.966 0 1.75.784 1.75 1.75v1.5A1.75 1.75 0 0 1 7.25 6H6v1h5.25A1.75 1.75 0 0 1 13 8.75V10h.25c.966 0 1.75.784 1.75 1.75v1.5A1.75 1.75 0 0 1 13.25 15h-2.5A1.75 1.75 0 0 1 9 13.25v-1.5c0-.966.784-1.75 1.75-1.75h.25V8.75a.25.25 0 0 0-.25-.25H6v1.5h.25c.966 0 1.75.784 1.75 1.75v1.5A1.75 1.75 0 0 1 6.25 15h-2.5A1.75 1.75 0 0 1 2 13.25v-1.5C2 10.784 2.784 10 3.75 10H4.5V6H1.75A1.75 1.75 0 0 1 0 4.25v-1.5C0 1.784.784 1 1.75 1Z"/></symbol>
            <symbol id="i-clock" viewBox="0 0 16 16"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0Zm0 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm.75 2.75v3.5l2.5 1.5-.75 1.25-3.25-1.95V4.25Z"/></symbol>
            <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 0 0-4.9 3H5.5V7H0V1.5h1.5v2.2A7 7 0 0 1 15 8h-1.5A5.5 5.5 0 0 0 8 2.5Zm6.5 6.5H16v5.5h-1.5v-2.2A7 7 0 0 1 1 8h1.5a5.5 5.5 0 0 0 9.9 3.5H10.5V10h4Z"/></symbol>
            <symbol id="i-search" viewBox="0 0 16 16"><path d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04-1.06 1.06ZM11 6.5a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"/></symbol>
            <symbol id="i-zoom-out" viewBox="0 0 16 16"><path d="M2 7.25h12v1.5H2Z"/></symbol>
            <symbol id="i-zoom-in" viewBox="0 0 16 16"><path d="M7.25 2h1.5v5.25H14v1.5H8.75V14h-1.5V8.75H2v-1.5h5.25Z"/></symbol>
            <symbol id="i-width" viewBox="0 0 16 16"><path d="M0 2h1.5v12H0Zm14.5 0H16v12h-1.5ZM4.28 5.22 5.34 6.28 4.12 7.5h7.76l-1.22-1.22 1.06-1.06L14.28 8l-2.56 2.78-1.06-1.06L11.88 8.5H4.12l1.22 1.22-1.06 1.06L1.72 8Z"/></symbol>
            <symbol id="i-folder-open" viewBox="0 0 16 16"><path d="M1.75 2h3.63c.46 0 .9.18 1.23.51L7.9 3.65h5.35c.97 0 1.75.78 1.75 1.75v.6H16l-1.7 6.63a1.75 1.75 0 0 1-1.7 1.32H1.75A1.75 1.75 0 0 1 0 12.2V3.75C0 2.78.78 2 1.75 2Zm11.75 4v-.6a.25.25 0 0 0-.25-.25H7.6a.75.75 0 0 1-.53-.22L5.55 3.57a.25.25 0 0 0-.17-.07H1.75a.25.25 0 0 0-.25.25V12.2c0 .07.02.13.06.18L3.1 6.57A.75.75 0 0 1 3.83 6Z"/></symbol>
            <symbol id="i-swap" viewBox="0 0 16 16"><path d="M9.72 1.72 13 5l-3.28 3.28-1.06-1.06L10.38 5.5H2V4h8.38L8.66 2.78ZM6.28 8.72l1.06 1.06L5.62 11.5H14V13H5.62l1.72 1.72-1.06 1.06L3 12.5Z"/></symbol>
            <symbol id="i-close" viewBox="0 0 16 16"><path d="M3.72 2.66 8 6.94l4.28-4.28 1.06 1.06L9.06 8l4.28 4.28-1.06 1.06L8 9.06l-4.28 4.28-1.06-1.06L6.94 8 2.66 3.72Z"/></symbol>
            <symbol id="i-up" viewBox="0 0 16 16"><path d="m8 4.5 5 5-1.06 1.06L8 6.62 4.06 10.56 3 9.5Z"/></symbol>
            <symbol id="i-down" viewBox="0 0 16 16"><path d="m8 11.5-5-5 1.06-1.06L8 9.38l3.94-3.94L13 6.5Z"/></symbol>
        </defs>
    </svg>

    <div id="app">
        <aside id="sidebar" aria-label="Markdown ファイル一覧">
            <div class="sidebar-head">
                <div class="sidebar-row">
                    <label class="sr-only" for="source-select">ソース</label>
                    <select id="source-select"></select>
                    <button type="button" class="icon-button" id="btn-open-path" title="パスを開く (Ctrl+O)" aria-label="パスを開く">
                        <svg aria-hidden="true"><use href="#i-folder-open" /></svg>
                    </button>
                    <button type="button" class="icon-button" id="btn-refresh" title="再読み込み" aria-label="再読み込み">
                        <svg aria-hidden="true"><use href="#i-refresh" /></svg>
                    </button>
                </div>
                <div class="sidebar-row" id="view-modes">
                    <button type="button" class="icon-button" id="btn-view-tree" title="フォルダーツリー" aria-pressed="false">
                        <svg aria-hidden="true"><use href="#i-tree" /></svg>
                    </button>
                    <button type="button" class="icon-button" id="btn-view-recent" title="更新日時順" aria-pressed="false">
                        <svg aria-hidden="true"><use href="#i-clock" /></svg>
                    </button>
                    <label class="sr-only" for="filter">絞り込み</label>
                    <input type="search" id="filter" placeholder="絞り込み" autocomplete="off" />
                </div>
            </div>
            <div id="tree" role="tree" tabindex="-1"></div>
            <div class="sidebar-foot">
                <span id="count"></span>
                <button type="button" class="icon-button" id="btn-swap-sidebar" title="サイドバーを左右入れ替え" aria-label="サイドバーを左右入れ替え">
                    <svg aria-hidden="true"><use href="#i-swap" /></svg>
                </button>
            </div>
        </aside>

        <div id="resizer" role="separator" aria-orientation="vertical" aria-label="サイドバーの幅"></div>

        <main id="main">
            <header id="toolbar">
                <button type="button" class="icon-button" id="btn-toggle-sidebar" title="サイドバーの表示切替 (Ctrl+B)" aria-label="サイドバーの表示切替">
                    <svg aria-hidden="true"><use href="#i-sidebar" /></svg>
                </button>
                <div id="title-box">
                    <div id="doc-title">SkimDown</div>
                    <div id="doc-subtitle"></div>
                </div>
                <div class="toolbar-actions">
                    <button type="button" class="icon-button" id="btn-find" title="このファイル内を検索 (Ctrl+F)" aria-label="検索">
                        <svg aria-hidden="true"><use href="#i-search" /></svg>
                    </button>
                    <button type="button" class="icon-button" id="btn-zoom-out" title="縮小 (Ctrl+-)" aria-label="縮小">
                        <svg aria-hidden="true"><use href="#i-zoom-out" /></svg>
                    </button>
                    <button type="button" class="icon-button" id="btn-zoom-reset" title="ズームをリセット (Ctrl+0)">100%</button>
                    <button type="button" class="icon-button" id="btn-zoom-in" title="拡大 (Ctrl++)" aria-label="拡大">
                        <svg aria-hidden="true"><use href="#i-zoom-in" /></svg>
                    </button>
                    <button type="button" class="icon-button" id="btn-width" title="本文の最大幅を切替 (Ctrl+] / Ctrl+[)" aria-label="本文の最大幅を切替">
                        <svg aria-hidden="true"><use href="#i-width" /></svg>
                    </button>
                </div>
            </header>

            <div class="bar" id="findbar" hidden>
                <label class="sr-only" for="find-input">このファイル内を検索</label>
                <input type="search" id="find-input" placeholder="このファイル内を検索" autocomplete="off" />
                <button type="button" class="icon-button" id="btn-find-case" title="大文字と小文字を区別" aria-pressed="false">Aa</button>
                <span class="count" id="find-count"></span>
                <button type="button" class="icon-button" id="btn-find-prev" title="前を検索 (Ctrl+Shift+G)" aria-label="前を検索">
                    <svg aria-hidden="true"><use href="#i-up" /></svg>
                </button>
                <button type="button" class="icon-button" id="btn-find-next" title="次を検索 (Ctrl+G)" aria-label="次を検索">
                    <svg aria-hidden="true"><use href="#i-down" /></svg>
                </button>
                <button type="button" class="icon-button" id="btn-find-close" title="検索を閉じる" aria-label="検索を閉じる">
                    <svg aria-hidden="true"><use href="#i-close" /></svg>
                </button>
            </div>

            <div class="bar" id="pathbar" hidden>
                <label class="sr-only" for="path-input">開くパス</label>
                <input type="text" id="path-input" placeholder="開くフォルダー、または .md ファイルのパス" autocomplete="off" spellcheck="false" />
                <button type="button" class="text-button" id="btn-path-open">開く</button>
                <button type="button" class="icon-button" id="btn-path-cancel" title="閉じる" aria-label="閉じる">
                    <svg aria-hidden="true"><use href="#i-close" /></svg>
                </button>
            </div>

            <div class="bar" id="linkbar" hidden>
                <span class="grow-text" id="link-text"></span>
                <button type="button" class="text-button" id="btn-link-open">外部で開く</button>
                <button type="button" class="icon-button" id="btn-link-cancel" title="閉じる" aria-label="閉じる">
                    <svg aria-hidden="true"><use href="#i-close" /></svg>
                </button>
            </div>

            <div class="bar privacy-bar" id="remotebar" hidden>
                <span class="grow-text" id="remote-text"></span>
                <button type="button" class="text-button" id="btn-remote-load">この文書で読み込む</button>
            </div>

            <div class="bar" id="deadbar" hidden>
                <span class="grow-text" id="deadbar-text">接続が切れました。拡張機能の再読み込みなどでこのパネルは更新されません。</span>
                <button type="button" class="text-button" id="btn-dead-reload">再読み込み</button>
            </div>

            <div id="preview-wrap">
                <iframe id="preview" src="renderer.html" title="Markdown プレビュー"></iframe>
                <div id="empty-state" hidden>Markdown が選択されていません。</div>
            </div>
        </main>
    </div>

    <div id="toast" role="status" hidden></div>

    <script src="shell.js"></script>
</body>
</html>
